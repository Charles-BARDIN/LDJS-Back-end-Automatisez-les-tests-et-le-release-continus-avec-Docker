# Continuous Integration workflow.
# Identical in both repositories: run-tests.sh auto-detects the project type
# (React or NestJS), so the same file works for the front-end and the back-end.
name: CI

# Trigger on every push, on every pull request, and manually (for releases).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # required by action-junit-report to publish the check run
    steps:
      # Fetch the repository sources.
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js 22 and cache the npm downloads to speed up subsequent runs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Run the unified test script (installs deps, cleans artifacts, runs the
      # suite, and writes a JUnit report to test-results/junit.xml).
      - name: Run unified test script
        run: bash run-tests.sh

      # Surface the test results in the GitHub UI (checks + annotations + summary).
      # always() so the report is published even when the test step fails.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/junit.xml

      # Keep the raw JUnit file as a downloadable artifact of the run.
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit.xml
          if-no-files-found: error

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test # only build once the tests pass
    permissions:
      contents: read
      packages: write # required to push the image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Buildx for an efficient, cache-aware Docker build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to the GitHub Container Registry (skipped on pull requests,
      # where the token is read-only / forks have no write access).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags: the branch name and the commit SHA.
      # metadata-action lowercases the image name (GHCR requires lowercase).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short

      # Build the image. Push only on pushes (not on pull requests).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test # never release a build whose tests fail
    # Manual trigger only, and only from main (semantic-release also enforces this).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # create the git tag, the release commit and the GitHub release
      issues: write # semantic-release comments on related issues
      pull-requests: write # semantic-release comments on related PRs
      packages: write # push the versioned image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Analyze the Conventional Commits, bump the version in package.json,
      # generate the changelog, create the GitHub release and the git tag.
      # The exec plugin exposes the computed version as the step output
      # "new_release_version" (empty when no release is warranted).
      - name: Semantic Release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The steps below run only when a new version was actually released.
      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_version != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag the image with the semantic version (e.g. 1.2.3).
      - name: Extract image metadata
        if: steps.semantic.outputs.new_release_version != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semantic.outputs.new_release_version }}

      - name: Build and push versioned image
        if: steps.semantic.outputs.new_release_version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
