name: Docker build and push
description: >
  Build the Docker image with Buildx (GHA layer cache) and, when pushing,
  authenticate to and push it to the GitHub Container Registry.

inputs:
  tags:
    description: Image tags to apply (output of docker/metadata-action).
    required: true
  labels:
    description: Image labels to apply (output of docker/metadata-action).
    required: false
    default: ""
  push:
    description: Whether to push the image to GHCR ("true"/"false").
    required: false
    default: "true"
  github-token:
    # secrets are not available inside composite actions, so the token is
    # passed in explicitly by the calling workflow.
    description: Token used to authenticate to GHCR when pushing.
    required: true

runs:
  using: composite
  steps:
    # Set up Buildx for an efficient, cache-aware Docker build.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Authenticate to GHCR only when we actually push (skipped on pull requests,
    # where the token is read-only / forks have no write access).
    - name: Log in to GHCR
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
